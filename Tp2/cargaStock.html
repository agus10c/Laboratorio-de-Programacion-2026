<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carga de Stock</title>
    <link rel="stylesheet" href="cargaStock.css" />
  </head>
  <body>
    <header class="encabezado-principal">
      <h1>Carga de Stock - Empresa de Construcción</h1>
    </header>
    <form action="">
      <label for="Adhesivo poliuretanico POLIKAL"
        >Adhesivo poliuretanico POLIKAL:</label
      >
      <input
        type="number"
        id="adhesivo-polikal"
        name="polikal"
        class="producto"
        min="0"
      /><br /><br />

      <label for="Adhesivo Vinílico x20 Kg">Adhesivo Vinílico x20 Kg:</label>
      <input
        type="number"
        id="adhesivo-vinilico"
        name="vinilico"
        class="producto"
        min="0"
      /><br /><br />

      <label for="EPS X 92-20">EPS X 92-20:</label>
      <input
        type="number"
        id="EPS-92-20"
        name="EPS-92-20"
        class="producto"
        min="0"
      /><br /><br />

      <label for="EPS X 120-20">EPS X 120-20:</label>
      <input
        type="number"
        id="EPS-120-20"
        name="EPS-120-20"
        class="producto"
        min="0"
      /><br /><br />
      <label for="Membrana acústica">Membrana acústica:</label>
      <input
        type="number"
        id="membrana-acustica"
        name="membrana-acustica"
        class="producto"
        min="0"
      /><br /><br />
      <label for="OSB 9,5 X u">OSB 9,5 X u:</label>
      <input
        type="number"
        id="OSB-9,5"
        name="OSB-9,5"
        class="producto"
        min="0"
      /><br /><br />
      <label for="OSB 18,1 X u">OSB 18,1 X u:</label>
      <input
        type="number"
        id="OSB-18,1"
        name="OSB-18,1"
        class="producto"
        min="0"
      /><br /><br />
      <label for="SHS 3,5-40 x 50u">SHS 3,5-40 x 50u:</label>
      <input
        type="number"
        id="SHS-3,5-40"
        name="SHS-3,5"
        class="producto"
        min="0"
      /><br /><br />
      <label for="SNK-HBS 6-100 x 100u">SNK-HBS 6-100 x 100u:</label>
      <input
        type="number"
        id="SNK-HBS_6-100"
        name="SNK"
        class="producto"
        min="0"
      /><br /><br />
      <label for="Tubo poliuretanico 750 FISCHER"
        >Tubo poliuretanico 750 FISCHER:</label
      >
      <input
        type="number"
        id="Tubo-poliuretanico"
        name="tubo_poliuretanico"
        class="producto"
        min="0"
      /><br /><br />

      <input type="submit" value="Cargar" />
    </form>
    <main>
      <form action="">
        <div class="campo">
          <label for="adhesivo-polikal">Adhesivo poliuretánico POLIKAL:</label>
          <input type="number" id="adhesivo-polikal" name="polikal" min="0" />
        </div>

        <div class="campo">
          <label for="adhesivo-vinilico">Adhesivo Vinílico x20 Kg:</label>
          <input type="number" id="adhesivo-vinilico" name="vinilico" min="0" />
        </div>

        <div class="campo">
          <label for="eps92">EPS X 92-20:</label>
          <input type="number" id="eps92" name="eps92" min="0" />
        </div>

        <div class="campo">
          <label for="eps120">EPS X 120-20:</label>
          <input type="number" id="eps120" name="eps120" min="0" />
        </div>

        <div class="campo">
          <label for="membrana-acustica">Membrana acústica:</label>
          <input
            type="number"
            id="membrana-acustica"
            name="membrana-acustica"
            min="0"
          />
        </div>

        <div class="campo">
          <label for="osb95">OSB 9,5 X u:</label>
          <input type="number" id="osb95" name="osb95" min="0" />
        </div>

        <div class="campo">
          <label for="osb181">OSB 18,1 X u:</label>
          <input type="number" id="osb181" name="osb181" min="0" />
        </div>

        <div class="campo">
          <label for="shs">SHS 3,5-40 x 50u:</label>
          <input type="number" id="shs" name="shs" min="0" />
        </div>

        <div class="campo">
          <label for="snk">SNK-HBS 6-100 x 100u:</label>
          <input type="number" id="snk" name="snk" min="0" />
        </div>

        <div class="campo">
          <label for="tubo-poliuretanico"
            >Tubo poliuretánico 750 FISCHER:</label
          >
          <input
            type="number"
            id="tubo-poliuretanico"
            name="tubo-poliuretanico"
            min="0"
          />
        </div>

        <input type="submit" value="Cargar" />
      </form>
    </main>

    <footer>
      <p>Carga de Stock. Sistema de control de materiales de Construcción</p>
    </footer>
  </body>
</html>
